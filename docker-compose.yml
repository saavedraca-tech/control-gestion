# Desarrollo local completo sin Supabase: PostgreSQL + API (login simulado) + frontend.
# En producción se usa Supabase (base, login y archivos): ver web/DESPLIEGUE.md.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cg }
    ports: ["54322:5432"]
    volumes:
      - ./web/dev/auth_stub.sql:/docker-entrypoint-initdb.d/00_auth.sql:ro
      - ./supabase/migrations/20261031000000_fase1.sql:/docker-entrypoint-initdb.d/01_fase1.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cg
      AUTH_MODO: dev
      STORAGE: local
      STORAGE_DIR: /data
      ADMIN_EMAILS: admin@estudio.local
      CORS_ORIGINS: http://localhost:3000
    volumes: ["cg-archivos:/data"]
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  cg-archivos:
